<!DOCTYPE html>
<html>
<head>
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    

<a href="../../index.html" class="home-btn">← Home</a>


<div class="game"> 
    <h1>Tic Tac Toe</h1>
    <div class="board">
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
    </div>
    <div class="popup" id="popup">
        <div class="popup-box">
            <h2 id="popup-title">X Wins!</h2>
            <button id="reset-btn">Play Again</button>
        </div>
    </div>
   <div class="game-modes">
    <button id="computer-mode">Play vs Computer</button>
    <button id="two-player-mode">2 Players</button>
</div>

</div>
<script src="script.js"></script>
</body>
</html>
